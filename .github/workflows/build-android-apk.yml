name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-apk:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build Web Application
        run: |
          npx vite build
        env:
          NODE_ENV: production

      - name: Install & Configure Capacitor CLI & Android
        run: |
          npm install --save-dev @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest --legacy-peer-deps --no-audit --no-fund
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Setup Android Permissions & Cleartext Traffic
        run: |
          # Ensure AndroidManifest has internet permission
          MANIFEST_FILE="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_FILE" ]; then
            if ! grep -q "android.permission.INTERNET" "$MANIFEST_FILE"; then
              sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />' "$MANIFEST_FILE"
            fi
          fi

      - name: Build Android APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate & Copy APK File
        id: find_apk
        run: |
          echo "Procurando arquivos APK gerados pelo Gradle..."
          find android -name "*.apk"
          APK_FILE=$(find android/app/build/outputs/apk -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "::error::Nenhum arquivo APK foi encontrado após a compilação do Gradle."
            exit 1
          fi
          echo "APK encontrado com sucesso em: $APK_FILE"
          cp "$APK_FILE" PlannerStudio-release.apk
          echo "apk_path=PlannerStudio-release.apk" >> "$GITHUB_OUTPUT"

      - name: Upload APK as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlannerStudio-Android-APK
          path: PlannerStudio-release.apk
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        continue-on-error: true
        with:
          tag_name: apk-v${{ github.run_number }}
          name: Planner Studio Android App v${{ github.run_number }}
          body: |
            ## 📱 Planner Studio - App Android Oficial

            APK compilado automaticamente com sucesso pelo GitHub Actions.

            - **Build Number:** #${{ github.run_number }}
            - **Commit:** `${{ github.sha }}`
            - **Branch:** `${{ github.ref_name }}`

            ### Como instalar no celular:
            1. Baixe o arquivo **PlannerStudio-release.apk** abaixo no seu aparelho Android.
            2. Toque no arquivo baixado e confirme a instalação (autorize a instalação de fontes desconhecidas se solicitado).
          files: |
            PlannerStudio-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
