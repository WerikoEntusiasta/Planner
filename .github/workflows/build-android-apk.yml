name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: Build Web Application
        run: npm run build

      - name: Install Capacitor CLI & Android
        run: |
          npm install --save-dev @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Planner Studio" "com.planner.studio" --web-dir dist || true
          npx cap add android || true
          npx cap sync android

      - name: Configure Android Permissions & Cleartext
        run: |
          # Ensure AndroidManifest has Internet permissions and cleartext traffic if needed
          if [ -f "android/app/src/main/AndroidManifest.xml" ]; then
            sed -i 's/<application/<application android:usesCleartextTraffic="true"/g' android/app/src/main/AndroidManifest.xml || true
          fi

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Locate Generated APK
        id: find_apk
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          cp "$APK_PATH" app-debug.apk

      - name: Upload APK as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Planner-Studio-Android-APK
          path: app-debug.apk
          retention-days: 30

      - name: Create GitHub Release with APK Download
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: android-build-v${{ github.run_number }}
          name: Planner Studio Android App (v${{ github.run_number }})
          body: |
            ## 📱 Planner Studio - Aplicativo Android Oficial
            
            Este APK foi gerado automaticamente pelo GitHub Actions sincronizado com o banco de dados e versão Web.
            
            - **Versão:** v${{ github.run_number }}
            - **Data:** ${{ github.event.head_commit.timestamp || 'Auto Build' }}
            - **Commit:** `${{ github.sha }}`
            
            ### Como instalar no celular:
            1. Baixe o arquivo `PlannerStudio.apk` abaixo no seu celular Android.
            2. Toque no arquivo baixado e selecione **Instalar**.
            3. Se solicitado, permita a instalação de apps desconhecidos para o navegador/gerenciador de arquivos.
          files: |
            app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
