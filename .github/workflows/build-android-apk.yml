name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-apk:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Node Dependencies
        run: |
          npm install --no-audit --no-fund

      - name: Build Web App
        run: npm run build
        env:
          NODE_ENV: production

      - name: Initialize & Sync Capacitor Android
        run: |
          npm install --save-dev @capacitor/core @capacitor/cli @capacitor/android
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Locate & Prepare APK
        run: |
          APK_FILE=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "Found APK: $APK_FILE"
          if [ -z "$APK_FILE" ]; then
            echo "Erro: APK nao encontrado"
            exit 1
          fi
          cp "$APK_FILE" PlannerStudio-release.apk

      - name: Upload APK as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlannerStudio-Android-APK
          path: PlannerStudio-release.apk
          retention-days: 30

      - name: Create GitHub Release with APK Download
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: apk-build-v${{ github.run_number }}
          name: Planner Studio Android App v${{ github.run_number }}
          body: |
            ## 📱 Planner Studio - Aplicativo Android Oficial

            APK compilado automaticamente e sincronizado em tempo real com o banco de dados.

            - **Build:** #${{ github.run_number }}
            - **Data:** ${{ github.event.head_commit.timestamp || 'Auto Build' }}
            - **Commit:** `${{ github.sha }}`

            ### Como instalar no celular:
            1. Baixe o arquivo **PlannerStudio-release.apk** abaixo no seu celular Android.
            2. Toque no arquivo baixado e confirme a instalação.
          files: |
            PlannerStudio-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
