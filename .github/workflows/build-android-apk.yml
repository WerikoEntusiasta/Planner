name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-apk:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NPM Dependencies
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build Web Client (Vite)
        run: |
          npx vite build
        env:
          NODE_ENV: production

      - name: Install & Configure Capacitor
        run: |
          npm install --save @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Setup Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate & Prepare APK
        run: |
          echo "Buscando APKs gerados..."
          find android/app/build/outputs -type f -name "*.apk"
          APK_FILE=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Erro: APK nao encontrado apos o build do gradle"
            exit 1
          fi
          echo "APK encontrado em: $APK_FILE"
          cp "$APK_FILE" PlannerStudio-release.apk

      - name: Upload APK as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlannerStudio-Android-APK
          path: PlannerStudio-release.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: apk-v${{ github.run_number }}
          name: Planner Studio Android App v${{ github.run_number }}
          body: |
            ## 📱 Planner Studio - App Android Oficial

            APK compilado automaticamente com sucesso.

            - **Build Number:** #${{ github.run_number }}
            - **Commit:** `${{ github.sha }}`

            ### Como instalar:
            1. Baixe o arquivo **PlannerStudio-release.apk** abaixo.
            2. No celular Android, toque no arquivo baixado e permita a instalação.
          files: |
            PlannerStudio-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
